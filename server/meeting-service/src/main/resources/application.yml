server:
  port: 8082
  # 只绑回环（评审 C2）：本服务用 UserContext.getUserId() 做会议归属校验，
  # 直连时伪造 X-User-Id 即可取消/改期他人会议。真实部署改为绑内网网卡 + 安全组。
  address: 127.0.0.1

spring:
  application:
    name: meeting-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/smt_meeting?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 与 deploy/docker-compose.infra.yml 的 REDIS_PASSWORD 同源（评审 C1 改法①：Redis 不再免密）
      # 幂等（IdempotentAspect）与分布式锁（RedissonConfig）都连这个实例
      password: ${REDIS_PASSWORD:redis123}
  # RabbitMQ（T4.1）：领域事件 → MQ。队列/交换机拓扑在 RabbitConfig 里声明式定义，
  # 这里只放连接信息；容器里 guest/guest 只允许从 localhost 登录，正好与本机开发一致。
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 发送失败要抛异常给 publisher（它自己 catch 后告警）——不能让它静默成功。
    # 配合 RabbitConfig 里的 RabbitTemplateCustomizer：correlated 只是"允许 broker 告知"，
    # 真正让"被 nack / 路由不到队列"变成日志 ERROR 的是那两个回调（评审 O5）
    publisher-confirm-type: correlated
    publisher-returns: true
  # Nacos 配置中心（T4.8）：限流阈值从配置中心读，改值不重启即时生效（@RefreshScope）
  config:
    import:
      # optional: 前缀很重要——配置中心拿不到时**不阻断启动**。限流是旁路保护，
      # 不能因为"配置中心访问不了"就让整个会议服务起不来（与切面的"异常放行"同一条原则）。
      - optional:nacos:meeting-service.yml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地开发固定回环注册：休眠/换网后局域网 IP 会变，否则 Feign/网关按旧 IP 连不上
        ip: 127.0.0.1
    openfeign:
      # 开启后 @FeignClient 的 fallbackFactory 才生效（依赖 Resilience4j）
      circuitbreaker:
        enabled: true
      client:
        config:
          # 超时必须配死（评审 P1-16）：Feign 默认 connect 10s / read **60s**，
          # 一个假死的 auth-service 会把 meeting 的请求线程挂住 60 秒——
          # "降级"根本来不及发生，核心链路先被拖死。auth 是内部调用 + 同机回环，给秒级足够。
          default:
            connect-timeout: 1000
            read-timeout: 2000
          # 与 @FeignClient(name = "auth-service") 对应
          'auth-service':
            connect-timeout: 500
            read-timeout: 1500

mybatis-plus:
  # SQL 手写 XML 为主（规范见 server/AI-RULES.md 第十一章），XML 扫描路径：
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL（手写 SQL 需可见执行语句）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  # ⚠️ 本服务的日志格式在 `logback-spring.xml` 里（T4.11 起）：审计需要独立 appender，yml 表达不了；
  # 而一旦有了 logback-spring.xml，yml 的 `logging.pattern.*` 就不再生效——traceId 的格式在 XML 里。
  level:
    com.smt: debug

storage:
  provider: ${STORAGE_PROVIDER:cos}   # cos | local
  local:
    dir: ${MINUTES_LOCAL_DIR:./data/minutes}
    base-url: ${MINUTES_LOCAL_BASE_URL:http://127.0.0.1:8082}

cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:}
  bucket: ${COS_BUCKET:}

minutes:
  upload:
    max-file-size-bytes: 2147483648
    chunk-size-bytes: 5242880
    session-ttl-hours: 24
    part-url-ttl-minutes: 60
  transcript:
    max-bytes: 5242880
    max-segments: 20000
    max-segment-chars: 2000
  ai:
    enabled: ${MINUTES_AI_ENABLED:true}
    provider: ${MINUTES_AI_PROVIDER:deepseek}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    api-key: ${DEEPSEEK_API_KEY:}
    timeout-ms: 120000
    max-attempts: 3
    max-input-chars: 60000
    max-chunks: ${MINUTES_AI_MAX_CHUNKS:10}
    regenerate-cooldown-seconds: ${MINUTES_AI_REGENERATE_COOLDOWN_SECONDS:60}
    scan-delay-ms: 5000
    stuck-timeout-minutes: 10
