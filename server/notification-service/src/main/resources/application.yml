server:
  port: 8083
  # 只绑回环（与另三个服务同一处置，评审 C2）：本服务的身份一律取自网关注入的 X-User-Id，
  # 直连本端口即可伪造身份头读别人的站内信。真实部署改为绑内网网卡 + 安全组。
  address: 127.0.0.1

spring:
  application:
    name: notification-service
  datasource:
    # 当前是**单库**：notification 表与会议表同在 smt_meeting（03 文档 5.7 的"未来分库目标"是 smt_notify）。
    # 单库不等于没有边界——本服务只碰 notification 表，跨服务数据（会议/参会人）通过 MQ 事件获得，
    # 这正是"将来能原地分库而不用上分布式事务"的前提，所以这里不去 join 会议表。
    url: jdbc:mysql://127.0.0.1:3306/smt_meeting?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 与 deploy/docker-compose.infra.yml 的 REDIS_PASSWORD 同源（评审 C1：Redis 不再免密）
      # T4.3 的消费幂等 SETNX(mq:idem:{msgId}) 走这个实例
      password: ${REDIS_PASSWORD:redis123}
  # RabbitMQ：**消费端**（T4.3）。拓扑与生产端同源（common 的 MeetingMqTopology），
  # 两边声明同名同参数是幂等的——谁先启动谁创建，不存在"生产端必须先启动"的时序依赖。
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 手动 ACK：处理成功才 ack（T4.3 ③）。自动模式下"方法返回即 ack"，
        # 把异常 catch 在方法里就会让失败静默变成成功——失败必须由代码显式决定去向。
        acknowledge-mode: manual
        # 反序列化失败这类"容器层"异常不要无限重投（重投多少次都一样），直接转死信。
        # 业务异常的去向由消费者代码显式 nack 决定，不依赖这个开关。
        default-requeue-rejected: false
        # 一次只预取一条：通知量不大，避免"消费者积压一堆未 ack 消息"在重启时被大量重投
        prefetch: 1
        # 每队列单消费者：同队列内串行 ⇒ 同一条消息不会被两个线程同时处理（幂等判断的竞态前提）
        concurrency: 1
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地开发固定回环注册（踩坑 #6）：休眠/换网后局域网 IP 会变，否则网关按旧 IP 连不上
        ip: 127.0.0.1

mybatis-plus:
  # SQL 手写 XML 为主（规范见 server/AI-RULES.md 第十一章），XML 扫描路径：
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL（手写 SQL 需可见执行语句）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  # 每行日志带上 traceId（T4.9）：`logging.pattern.level` 会替换掉默认的 `%5p`，
  # 于是格式变成 `时间 [traceId:xxx] 级别 --- [线程] logger : 消息`——
  # 排障时拿一次请求的 traceId 就能把三个服务的日志串起来（`grep 'traceId:xxx' logs/*.log`）。
  # `:-` 是 logback 的默认值语法：MDC 里没有时打空，不会打出字面量 "traceId:null"。
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    com.smt: debug
    # 重试过程默认**没有任何日志**（RetryTemplate 内部只在失败时由调用方记录），
    # 于是"消息到底重试了几次、退避了多久"完全看不见——排障时只能靠猜。
    # 开发期打开它，日志里会出现 `Retry: count=0/1/2`，重试次数一目了然
    # （scripts/verify-m4-notify-consume.sh 就是拿这几行当断言的；上量后按需调回 info）
    org.springframework.retry: debug
