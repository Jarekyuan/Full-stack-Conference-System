server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    # caching_sha2_password 认证在非 SSL 连接下需 allowPublicKeyRetrieval=true
    url: jdbc:mysql://127.0.0.1:3306/smt_meeting?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地开发固定回环注册：休眠/换网后局域网 IP 会变，否则网关按旧 IP 连不上（踩坑见 2026-10-14 记忆）
        ip: 127.0.0.1

mybatis-plus:
  # SQL 手写 XML 为主（规范见 server/AI-RULES.md 第十一章），XML 扫描路径：
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL（手写 SQL 需可见执行语句）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 认证配置（secret 必须与 gateway 保持一致，否则签发的 token 过不了网关验签）
security:
  jwt:
    secret: ${JWT_SECRET:smt-dev-secret-0123456789-abcdefghijklmnopqrstuv}
    access-token-ttl: 30m
    refresh-token-ttl: 7d

logging:
  level:
    com.smt: debug
