server:
  port: 8080
  # 只绑回环（评审 C2）：三个服务若绑 0.0.0.0，同网段任何机器都能直连并伪造 X-User-* 头冒充 ADMIN，
  # 网关的"验签后注入身份头"就完全失效——身份头方案的安全性依赖"服务只在网关后面可达"这个前提。
  # 部署到真实环境时改为绑内网网卡，并由安全组/防火墙保证业务端口不对外暴露。
  address: 127.0.0.1

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地开发固定回环注册：休眠/换网后局域网 IP 会变，否则服务发现按旧 IP 连不上
        ip: 127.0.0.1
    gateway:
      # 路由表（对照 docs/04 接口设计 1.1）：/api 前缀统一 StripPrefix=1 剥离后转发
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            # v1.3：新增 /api/depts/**（部门）、/api/roles/**（角色列表）
            - Path=/api/auth/**,/api/users/**,/api/depts/**,/api/roles/**
          filters:
            - StripPrefix=1
        - id: meeting-service
          uri: lb://meeting-service
          predicates:
            - Path=/api/rooms/**,/api/room-groups/**,/api/meetings/**,/api/approvals/**,/api/files/**,/api/stats/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
        # WebSocket 路由（端点在 T4.6 实现）：保留 /ws 前缀原样转发
        - id: notification-ws
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 网关鉴权配置（JwtAuthFilter / AuthProperties）
security:
  jwt:
    # 开发默认密钥（HS256 ≥32 字节）；生产用环境变量 JWT_SECRET 注入覆盖
    secret: ${JWT_SECRET:smt-dev-secret-0123456789-abcdefghijklmnopqrstuv}
  whitelist:
    - /api/auth/login
    - /api/auth/refresh
    - /actuator/**

logging:
  level:
    com.smt: debug
