# 访问日志只记录 $uri，不含 query string：
# WS 的 ?token= 是短期凭证，不能落日志。
log_format smt '$remote_addr - $remote_user [$time_local] '
               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
               '"$http_referer" "$http_user_agent"';

# 前端 Nginx：SPA history 路由兜底 + API / WebSocket 反代
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log smt;

    # Docker 内嵌 DNS：服务容器重建后 IP 变化，Nginx 也能在 valid 周期内重新解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway gateway:8080;
    set $meeting meeting-service:8082;

    # 分片上传单片默认 5MiB；本地存储 PUT 也走这里
    client_max_body_size 64m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # 后端 API：保留 /api 前缀，交给 gateway 做 StripPrefix
    location /api/ {
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket：必须显式转发 Upgrade/Connection
    location /ws/ {
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 无尾斜杠时明确 308，避免落到 SPA fallback 返回 index.html
    location = /api { return 308 /api/; }
    location = /ws { return 308 /ws/; }

    # Vite 产物带内容 hash，可长期缓存（expires 已包含 Cache-Control）
    location /assets/ {
        expires 7d;
    }

    # SPA 深层路由刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
