# 前端 Nginx：SPA history 路由兜底 + API / WebSocket / 本地文件反代
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 分片上传单片默认 5MiB；本地存储 PUT 也走这里
    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # 后端 API：保留 /api 前缀，交给 gateway 做 StripPrefix
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket：必须显式转发 Upgrade/Connection
    location /ws/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # STORAGE_PROVIDER=local 时的预签名上传/下载端点
    # 与前端同源，避免浏览器跨域；流式转发，不在 Nginx 落盘
    location /files/local/ {
        proxy_pass http://meeting-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64m;
        proxy_request_buffering off;
    }

    # Vite 产物带内容 hash，可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 深层路由刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
