name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: smt_meeting
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: smt
          RABBITMQ_DEFAULT_PASS: smt123
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # 与 application.yml 的 serverTimezone / 本地开发环境保持一致
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/smt_meeting?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      # 业务服务使用最小权限账号（由 db/01-schema.sql 创建）
      SPRING_DATASOURCE_USERNAME: smt_app
      SPRING_DATASOURCE_PASSWORD: smt_app123
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
      # CI 的 Redis 不设口令；空值让 Spring/Redisson 跳过 AUTH
      REDIS_PASSWORD: ""
      SPRING_RABBITMQ_HOST: 127.0.0.1
      SPRING_RABBITMQ_PORT: 5672
      RABBITMQ_USER: smt
      RABBITMQ_PASSWORD: smt123
      # 单测不依赖 Nacos；AuthFeignClientTest 需要真实 auth-service，单独手动跑
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Initialize database
        run: |
          MYSQL_ID=$(docker ps --filter "ancestor=mysql:8.0" --format "{{.ID}}" | head -n1)
          test -n "$MYSQL_ID"
          docker exec -i "$MYSQL_ID" mysql -uroot -proot123 < db/01-schema.sql
          docker exec -i "$MYSQL_ID" mysql -uroot -proot123 < db/02-seed.sql

      - name: Run backend tests
        # AuthFeignClientTest 的“auth 在线/离线”双态断言需要真实 auth-service，
        # 默认套件排除；用 docs/05 的命令手动跑。
        working-directory: server
        run: >-
          mvn -B -ntp test
          -Dtest='!AuthFeignClientTest'
          -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: Frontend check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint, unit tests
        run: npm run check

      - name: Build
        run: npm run build

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy/docker-compose.yml
        run: docker compose -f deploy/docker-compose.yml config --quiet

  docker-build:
    name: Docker images & Nginx
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose -f deploy/docker-compose.yml build

      - name: Validate Nginx config
        run: >-
          docker run --rm
          --add-host gateway:127.0.0.1
          --add-host meeting-service:127.0.0.1
          -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine nginx -t

      - name: Ensure no local secret config in jars
        run: |
          set -e
          for img in smt/auth-service:latest smt/gateway:latest smt/meeting-service:latest smt/notification-service:latest; do
            cid=$(docker create "$img")
            docker cp "$cid:/app/app.jar" /tmp/app.jar
            docker rm "$cid" >/dev/null
            if unzip -l /tmp/app.jar | grep -qE 'application-local\.ya?ml|\.local\.ya?ml'; then
              echo "secret config found in $img" >&2
              exit 1
            fi
          done

  compose-smoke:
    name: Compose smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GitHub-hosted runner 上没有本地栈；若改 self-hosted，还需覆盖 8080/8000/3306 等端口
      MYSQL_CONTAINER_NAME: smt-ci-mysql
      REDIS_CONTAINER_NAME: smt-ci-redis
      RABBITMQ_CONTAINER_NAME: smt-ci-rabbitmq
      NACOS_CONTAINER_NAME: smt-ci-nacos
      SMT_NETWORK: smt-ci-net
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose -p "smt-ci-${{ github.run_id }}" -f deploy/docker-compose.yml up -d --build

      - name: Deployment acceptance (with startup retry)
        run: |
          for i in $(seq 1 30); do
            if bash scripts/verify-deploy.sh; then
              exit 0
            fi
            echo "stack not ready yet, retry ${i}/30"
            sleep 10
          done
          docker compose -p "smt-ci-${{ github.run_id }}" -f deploy/docker-compose.yml ps --all
          docker compose -p "smt-ci-${{ github.run_id }}" -f deploy/docker-compose.yml logs --tail=100
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose -p "smt-ci-${{ github.run_id }}" -f deploy/docker-compose.yml down -v
